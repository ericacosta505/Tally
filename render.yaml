services:
  # Backend API Service
  - type: web
    name: budget-tracker-backend
    env: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budget-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FRONTEND_URL
        sync: false  # Set this to your frontend URL after deployment

  # PostgreSQL Database
  - type: pg
    name: budget-tracker-db
    plan: starter
    databaseName: budget_tracker
    user: budget_tracker_user

  # Frontend Static Site
  - type: web
    name: budget-tracker-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this to your backend URL after deployment

